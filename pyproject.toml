[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-agent-press-wire"
version = "0.1.0"
description = "LangChain tools for Agent Press Wire: press releases and newswire distribution paid per call in USDC over x402"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dylan Caponi" }]
requires-python = ">=3.10,<4.0"
keywords = ["langchain", "x402", "press release", "newswire", "agents", "usdc", "base"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langchain-core>=0.3.0,<2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "x402[evm]>=2.25,<3.0",
]

[project.urls]
Homepage = "https://agentpresswire.dev"
Source = "https://github.com/dylancaponi/langchain-agent-press-wire"
Documentation = "https://agentpresswire.dev/llms.txt"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "langchain-tests>=1.0",
]
lint = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_agent_press_wire"]

[tool.hatch.build.targets.sdist]
include = ["langchain_agent_press_wire", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["compile: compile-only test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]
