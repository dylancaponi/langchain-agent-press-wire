name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p ${{ matrix.python-version }}
      - run: uv pip install -e . pytest pytest-asyncio pytest-socket respx langchain-tests ruff
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest tests/unit_tests -q
